name: Temporary Whisper Base Model Transfer

on:
  push:
    branches:
      - chatgpt-whisper-model-transfer

jobs:
  fetch-model:
    runs-on: ubuntu-latest
    steps:
      - name: Download and verify Whisper base English model
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-all-errors \
            -o ggml-base.en.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.en.bin
          echo "a03779c86df3323075f5e796cb2ce5029f00ec8869eee3fdfb897afe36c6d002  ggml-base.en.bin" | sha256sum -c -
          ls -lh ggml-base.en.bin
      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisper-base-en
          path: ggml-base.en.bin
          retention-days: 1
          compression-level: 0

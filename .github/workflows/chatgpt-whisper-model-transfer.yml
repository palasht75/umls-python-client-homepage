name: Temporary Whisper Model Transfer

on:
  push:
    branches:
      - chatgpt-whisper-model-transfer

jobs:
  fetch-model:
    runs-on: ubuntu-latest
    steps:
      - name: Download and verify quantized Whisper model
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-all-errors \
            -o ggml-tiny.en-q5_1.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en-q5_1.bin
          echo "c77c5766f1cef09b6b7d47f21b546cbddd4157886b3b5d6d4f709e91e66c7c2b  ggml-tiny.en-q5_1.bin" | sha256sum -c -
          ls -lh ggml-tiny.en-q5_1.bin
      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisper-tiny-en-q5_1
          path: ggml-tiny.en-q5_1.bin
          retention-days: 1
          compression-level: 0
